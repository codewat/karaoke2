plugins {
    id 'com.android.application'
}

android {
    namespace 'com.partykaraoke.tv'
    compileSdk 34

    defaultConfig {
        applicationId "com.partykaraoke.tv"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Pure Android framework - zero external dependencies needed!
}
